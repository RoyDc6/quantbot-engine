# config/universe_config.yaml — QuantBot 资产配置中心 v2.0
# 单一真相源：所有管线通过此文件获取标的定义、适配器类型、元数据。
# FusionController / AdapterFactory / UniverseManager 均以此文件为准。
#
# ticker:  标准符号（00700.HK / AAPL.US / BTC.USDT）
# adapter: 实现 BaseAdapter 接口的适配器类名（FutuAdapter / CryptoAdapter）
# params:  适配器特定参数（market 为必填: HK / US / Crypto）
# enabled: false → 系统跳过此标的

version: 2.0

assets:
  # ── 港股（Futu API primary / TickFlow fallback）──
  - ticker: 00700.HK
    name: 腾讯
    adapter: FutuAdapter
    params: { market: HK, lot_size: 100 }
    enabled: true

  - ticker: 09988.HK
    name: 阿里巴巴
    adapter: FutuAdapter
    params: { market: HK, lot_size: 100 }
    enabled: true


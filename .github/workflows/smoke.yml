# Phase E — Live Safety Invariants + Smoke Test CI
#
# 每次 push / pull_request 自动运行：
#   1. compileall — 验证核心模块无语法错误
#   2. pytest — 运行全部 smoke tests（含安全不变量）
#   3. repository secret check — 阻止高置信凭据进入当前代码树
#   4. git show --check / git diff --check — 阻止尾随空格
#
# 不连接 Futu OpenD（通过 Mock、--help 等路径避免连接外部服务）
# 不读取交易密码 / 不运行 real 扫描
# 安全不变量覆盖：
#   - bat 文件不得包含 --live
#   - 生产路径禁止 TrdEnv.REAL
#   - futu_adapter.py place_order 必须使用 SIMULATE
#   - --help 必须包含 --live 和 --confirm-live
#   - --live 未确认时应阻止 OrderExecutor 实例化

name: Smoke & Safety

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # 需要历史记录做 range check

      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install minimum dependencies
        run: python -m pip install pytest futu-api pandas numpy
        shell: pwsh

      - name: compileall — core modules
        run: python -m compileall -q unified_runner.py reports/fusion_report_v3.py core
        shell: pwsh

      - name: Repository secret check
        run: python scripts/check_secrets.py
        shell: pwsh

      - name: pytest — smoke tests (no external service)
        run: python -m pytest tests/smoke/ -vv --durations=10
        timeout-minutes: 20

      - name: git diff/show --check (trailing whitespace on new changes)
        run: |
          if ("${{ github.event_name }}" -eq "pull_request") {
            git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.sha }}"
          } elseif ("${{ github.event.before }}" -match '^0+$') {
            git show --check --format= "${{ github.sha }}"
          } else {
            git diff --check "${{ github.event.before }}...${{ github.sha }}"
          }
        shell: pwsh

      - name: Summary
        if: always()
        run: |
          echo "Smoke & Safety CI completed."
          echo "If any test failed:"
          echo "  - bat 文件不得包含 --live"
          echo "  - 生产文件不得引入 TrdEnv.REAL"
          echo "  - --live need --confirm-live to execute"
        shell: pwsh

name: Bug report
description: Report a reproducible defect in code, tests, or documentation
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve QuantBot Engine. Do not include credentials, account data, or private market data. Use the private process in SECURITY.md for sensitive reports.
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues and pull requests.
          required: true
        - label: I removed credentials, account identifiers, and private data.
          required: true
        - label: I can reproduce this without a real-money trading account.
          required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the defect and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest safe example, including exact commands when possible.
      placeholder: |
        1. Run ...
        2. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit or version
      placeholder: git rev-parse --short HEAD
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Python version, and relevant optional provider versions.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation output
      description: Share sanitized test output or a minimal traceback. Never paste secrets.
    validations:
      required: false
